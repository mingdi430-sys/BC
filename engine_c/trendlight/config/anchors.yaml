# 범용 앵커: 모든 요청에 1개 포함해 응답 간 척도를 통일한다.
# 데이터랩은 요청 내 최대값=100으로 정규화하므로, 요청마다 척도가 다르다.
# 앵커를 같이 넣고 앵커=1.0 척도로 재정규화하면 요청 간 비교가 가능해진다.
general_anchors:
  # 우선순위 순. probe 단계에서 기간 내 결측/급변이 없는 첫 번째를 채택한다.
  - 쿠팡
  - 날씨
  - 유튜브
  - 네이버
  - 배달의민족

# 재정규화 방식
#   mean   : 앵커의 기간 평균으로 나눔 (앵커 자체 계절성이 아이템에 섞이지 않음, 기본값)
#   weekly : 주별 앵커 값으로 나눔
normalize_method: mean

# 2단 앵커 규칙
two_stage:
  # 첫 호출 후 데이터랩 소수 자릿수를 확인한다 (client가 로그 + data/cache/datalab_precision.json 기록).
  # 아이템의 최대 raw 값이 min_item_max 미만이면 범용 앵커 대비 눌린 것으로 보고
  # 범용 → 업종 앵커 → 아이템 체인으로 자동 전환한다.
  min_item_max: 1.0
  # 업종 앵커 (industries.yaml의 anchor 필드와 동일해야 함)
  industry_anchors:
    대형할인점: 코스트코
    편의점: 편의점
    슈퍼마켓: 마트
    일반한식: 맛집
    갈비전문점: 고기집
    한정식: 한정식
    일식회집: 스시
    중국음식: 중식
    서양음식: 파스타
    스넥: 분식
    제과점: 빵집
  # 업종을 모르는 키워드(라벨 등)에 쓰는 기본 업종 앵커
  fallback_industry_anchor: 맛집

# 요청 구성
request:
  max_groups: 5        # 앵커 1 + 아이템 4
  time_unit: week
  start_date: "2020-01-01"
